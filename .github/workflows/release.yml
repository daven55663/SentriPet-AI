name: Release

# Pushing a tag like v1.4.0 builds every package on its own system, checks it, and publishes a GitHub Release.
# The release stays a draft until all packages passed their self-test and were uploaded.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draft with the release notes
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --draft --title "SentriPet ${GITHUB_REF_NAME#v}" --notes-file "$notes"

  package:
    name: Package (${{ matrix.rid }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: dist/publish-win-x64/SentriPet.exe }
          - { os: macos-latest, rid: osx-arm64, exe: dist/osx-arm64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: macos-latest, rid: osx-x64, exe: dist/osx-x64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: ubuntu-latest, rid: linux-x64, exe: dist/publish-linux-x64/SentriPet }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the self-contained package
        shell: bash
        run: bash xplat/package.sh ${{ matrix.rid }}
      - name: Self-test of the packaged program
        shell: bash
        run: |
          "${{ matrix.exe }}" --selftest package-test.txt
          tail -n 1 package-test.txt
      - name: Upload to the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/SentriPet-*.zip dist/SentriPet-*.tar.gz)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  wpf:
    name: Windows app (WPF)
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build with the C# compiler that ships with Windows
        shell: cmd
        run: call build.cmd
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--selftest', 'test-report.txt' -Wait -PassThru
          Get-Content test-report.txt -Encoding utf8 | Select-Object -Last 1
          if ($p.ExitCode -ne 0) { Write-Error "$($p.ExitCode) check(s) failed"; exit 1 }
      - name: Zip and upload to the release
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "SentriPet-$ver-windows-wpf.zip"
          Copy-Item LICENSE bin\LICENSE.txt
          Compress-Archive -Path bin\SentriPet.exe, bin\SentriPet.exe.config, bin\examples, bin\LICENSE.txt -DestinationPath $name
          gh release upload $env:GITHUB_REF_NAME $name --clobber

  publish:
    name: Publish the release
    needs: [package, wpf]
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
