name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the cross-platform projects (.NET 10)
        run: dotnet build SentriPet.slnx -c Release

      - name: Core tests (everything except the Windows widget)
        shell: bash
        run: |
          set +e
          dotnet run --no-build -c Release --project xplat/SentriPet.Tests -- core-report.txt
          code=$?
          summary=$(tail -n 1 core-report.txt)
          echo "### Core tests on ${{ runner.os }}: $summary" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL ' core-report.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Chinese fonts for the screenshots (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk > /dev/null

      - name: Desk pet self-test (Avalonia, off-screen)
        shell: bash
        run: |
          set +e
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --selftest desktop-report.txt
          code=$?
          cat desktop-report.txt
          echo "### Desk pet self-test on ${{ runner.os }}: $(tail -n 1 desktop-report.txt)" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL ' desktop-report.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Probe on a clean machine (no AI tools installed)
        shell: bash
        run: |
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --probe probe.txt
          cat probe.txt

      - name: Start the desk pet for real (smoke test, 15 s on the runner's desktop)
        shell: bash
        run: |
          set +e
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb > /dev/null
            run="xvfb-run -a"
          fi
          $run dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --dev --smoke-test smoke-report.txt
          code=$?
          cat smoke-report.txt
          echo "### Smoke test on ${{ runner.os }}: $(tail -n 1 smoke-report.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            for log in "$APPDATA/SentriPet-dev/logs/app.log" "$HOME/.config/SentriPet-dev/logs/app.log" "$HOME/Library/Application Support/SentriPet-dev/logs/app.log"; do
              [ -f "$log" ] && { echo "== $log"; tail -n 40 "$log"; }
            done
          fi
          exit $code

      - name: Render the desk pet off-screen (Avalonia, no display needed)
        shell: bash
        run: |
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --snapshot pet-shots
          # the other languages (checks the CJK fonts of each system)
          for l in en ja ko zh-CN; do
            dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --snapshot pet-shots/lang-$l --lang $l
          done
          ls -R pet-shots
          errors=$(find pet-shots -name '*_error.txt')
          if [ -n "$errors" ]; then cat $errors; exit 1; fi
          echo "Rendered $(find pet-shots -name '*.png' | wc -l) screenshots on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ runner.os }}
          path: |
            core-report.txt
            desktop-report.txt
            smoke-report.txt
            probe.txt
            pet-shots/
          if-no-files-found: warn

  package:
    name: Package (${{ matrix.rid }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: dist/publish-win-x64/SentriPet.exe }
          - { os: macos-latest, rid: osx-arm64, exe: dist/osx-arm64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: macos-latest, rid: osx-x64, exe: dist/osx-x64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: ubuntu-latest, rid: linux-x64, exe: dist/publish-linux-x64/SentriPet }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the self-contained package
        shell: bash
        run: bash xplat/package.sh ${{ matrix.rid }}

      - name: Smoke test (the packaged program runs its own self-test)
        shell: bash
        run: |
          "${{ matrix.exe }}" --selftest package-test.txt
          tail -n 1 package-test.txt
          echo "### ${{ matrix.rid }}: $(ls dist/SentriPet-* | xargs -n1 basename) — $(tail -n 1 package-test.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: SentriPet-${{ matrix.rid }}
          path: |
            dist/SentriPet-*.zip
            dist/SentriPet-*.tar.gz
          if-no-files-found: error

  build-and-test:
    name: Windows app (WPF) + self-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build with the C# compiler that ships with Windows
        shell: cmd
        run: call build.cmd

      - name: Self-test (every automated check)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--selftest', 'test-report.txt' -Wait -PassThru
          $report = Get-Content test-report.txt -Encoding utf8
          $report
          $summary = $report | Select-Object -Last 1
          "### Self-test`n$summary`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $fails = $report | Where-Object { $_ -like 'FAIL *' }
          if ($fails) { ($fails | ForEach-Object { "- $_" }) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          if ($p.ExitCode -ne 0) { Write-Error "$($p.ExitCode) check(s) failed"; exit 1 }

      - name: Probe on a clean machine (no AI tools installed)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--probe', 'probe.txt' -Wait -PassThru
          Get-Content probe.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { Write-Error "probe exited with $($p.ExitCode)"; exit 1 }

      - name: Render every theme (mock data)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--snapshot', 'shots', '--mock' -Wait -PassThru
          $errors = @(Get-ChildItem shots -Filter *_error.txt)
          foreach ($e in $errors) { Get-Content $e.FullName }
          $count = @(Get-ChildItem shots -Filter *.png).Count
          "Rendered $count images"
          "Rendered $count theme screenshots (artifact: test-results)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($p.ExitCode -ne 0 -or $errors.Count -gt 0 -or $count -lt 50) { Write-Error "theme rendering failed"; exit 1 }

      - name: Render every theme in the other languages
        shell: pwsh
        run: |
          foreach ($l in 'en', 'ja', 'ko', 'zh-CN') {
            $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--snapshot', "shots-lang\$l", '--mock', '--lang', $l -Wait -PassThru
            $errors = @(Get-ChildItem "shots-lang\$l" -Filter *_error.txt)
            foreach ($e in $errors) { Get-Content $e.FullName }
            $count = @(Get-ChildItem "shots-lang\$l" -Filter *.png).Count
            "${l}: rendered $count images"
            if ($p.ExitCode -ne 0 -or $errors.Count -gt 0 -or $count -lt 50) { Write-Error "theme rendering failed ($l)"; exit 1 }
          }

      - name: Render the menu and the settings page (and switch the language while running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin\SentriPet.exe -ArgumentList '--snapshot-ui', 'ui-shots', '--switch-lang', 'en' -Wait -PassThru
          Get-ChildItem ui-shots | Format-Table Name, Length
          if ($p.ExitCode -ne 0 -or -not (Test-Path ui-shots\settings.png) -or -not (Test-Path ui-shots\menu.png) -or -not (Test-Path ui-shots\switched_settings.png)) { Write-Error "UI rendering failed"; exit 1 }

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-report.txt
            probe.txt
            shots/
            shots-lang/
            ui-shots/
          if-no-files-found: warn

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: SentriPet-${{ github.sha }}
          path: |
            bin/SentriPet.exe
            bin/SentriPet.exe.config
            bin/examples/
