name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the cross-platform projects (.NET 10)
        run: dotnet build SentriPet.slnx -c Release

      - name: Core tests (everything except the Windows widget)
        shell: bash
        run: |
          set +e
          dotnet run --no-build -c Release --project xplat/SentriPet.Tests -- core-report.txt
          code=$?
          summary=$(tail -n 1 core-report.txt)
          echo "### Core tests on ${{ runner.os }}: $summary" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL ' core-report.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Chinese fonts for the screenshots (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk > /dev/null

      - name: Desk pet self-test (Avalonia, off-screen)
        shell: bash
        run: |
          set +e
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --selftest desktop-report.txt
          code=$?
          cat desktop-report.txt
          echo "### Desk pet self-test on ${{ runner.os }}: $(tail -n 1 desktop-report.txt)" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL ' desktop-report.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Probe on a clean machine (no AI tools installed)
        shell: bash
        run: |
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --probe probe.txt
          cat probe.txt

      - name: Start the desk pet for real (smoke test, 15 s on the runner's desktop)
        shell: bash
        run: |
          set +e
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb > /dev/null
            run="xvfb-run -a"
          fi
          $run dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --dev --smoke-test smoke-report.txt
          code=$?
          cat smoke-report.txt
          echo "### Smoke test on ${{ runner.os }}: $(tail -n 1 smoke-report.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            for log in "$APPDATA/SentriPet-dev/logs/app.log" "$HOME/.config/SentriPet-dev/logs/app.log" "$HOME/Library/Application Support/SentriPet-dev/logs/app.log"; do
              [ -f "$log" ] && { echo "== $log"; tail -n 40 "$log"; }
            done
          fi
          exit $code

      - name: Render the desk pet off-screen (Avalonia, no display needed)
        shell: bash
        run: |
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --snapshot pet-shots
          # the other languages (checks the CJK fonts of each system)
          for l in en ja ko zh-CN; do
            dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --snapshot pet-shots/lang-$l --lang $l
          done
          # the animated tour for the README (docs/images/demo*.gif)
          dotnet run --no-build -c Release --project xplat/SentriPet.Desktop -- --demo pet-shots/demo.gif --lang en
          ls -R pet-shots
          errors=$(find pet-shots -name '*_error.txt')
          if [ -n "$errors" ]; then cat $errors; exit 1; fi
          echo "Rendered $(find pet-shots -name '*.png' | wc -l) screenshots on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ runner.os }}
          path: |
            core-report.txt
            desktop-report.txt
            smoke-report.txt
            probe.txt
            pet-shots/
          if-no-files-found: warn

  package:
    name: Package (${{ matrix.rid }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: dist/publish-win-x64/SentriPet.exe }
          - { os: macos-latest, rid: osx-arm64, exe: dist/osx-arm64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: macos-latest, rid: osx-x64, exe: dist/osx-x64/SentriPet.app/Contents/MacOS/SentriPet }
          - { os: ubuntu-latest, rid: linux-x64, exe: dist/publish-linux-x64/SentriPet }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the self-contained package
        shell: bash
        run: bash xplat/package.sh ${{ matrix.rid }}

      - name: Smoke test (the packaged program runs its own self-test)
        shell: bash
        run: |
          "${{ matrix.exe }}" --selftest package-test.txt
          tail -n 1 package-test.txt
          echo "### ${{ matrix.rid }}: $(ls dist/SentriPet-* | xargs -n1 basename) — $(tail -n 1 package-test.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: SentriPet-${{ matrix.rid }}
          path: |
            dist/SentriPet-*.zip
            dist/SentriPet-*.tar.gz
          if-no-files-found: error
