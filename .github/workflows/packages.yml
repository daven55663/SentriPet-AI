name: Package managers

# Installs the published release through this repository's Scoop bucket (bucket/) and Homebrew tap (Casks/),
# runs the installed program's self-test and removes it again. Runs when the manifests change, and after each
# release (the Release workflow updates the manifests and starts this one).
on:
  push:
    branches: [main]
    paths: ['bucket/**', 'Casks/**', 'packaging/**', '.github/workflows/packages.yml']
  workflow_dispatch:

jobs:
  scoop:
    name: Scoop (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $env:GITHUB_PATH
      - name: Install SentriPet from this bucket
        shell: pwsh
        run: |
          # exactly what users run (Scoop only takes a git URL, not a local folder; this workflow runs on main)
          scoop bucket add sentripet "https://github.com/$env:GITHUB_REPOSITORY"
          scoop install sentripet
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep 8
          # post_install starts it
          $running = Get-Process SentriPet -ErrorAction SilentlyContinue
          if (-not $running) { Write-Error "SentriPet did not start after the install"; exit 1 }
          $running | Format-Table Id, Path -AutoSize
          $running | Stop-Process -Force
      - name: Self-test of the installed program
        shell: pwsh
        run: |
          $exe = Join-Path (scoop prefix sentripet) 'SentriPet.exe'
          $p = Start-Process $exe -ArgumentList '--selftest', "$env:GITHUB_WORKSPACE\scoop-test.txt" -Wait -PassThru
          Get-Content scoop-test.txt -Tail 1
          "### Scoop: $(Get-Content scoop-test.txt -Tail 1)" >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { Get-Content scoop-test.txt; exit 1 }
      - name: Uninstall
        shell: pwsh
        run: |
          scoop uninstall sentripet
          if ($LASTEXITCODE) { exit 1 }

  homebrew:
    name: Homebrew (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tap this repository and check the cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # brew audit asks the GitHub API (anonymous calls hit the rate limit)
        run: |
          brew tap daven55663/sentripet "$GITHUB_WORKSPACE"
          brew style --cask daven55663/sentripet/sentripet
          brew audit --cask --online daven55663/sentripet/sentripet || echo "::warning::brew audit reported problems (see above)"
          # the Intel package too (this runner is Apple silicon): download and check its SHA-256
          brew fetch --cask --arch=intel daven55663/sentripet/sentripet
      - name: Install, self-test, uninstall
        run: |
          brew install --cask daven55663/sentripet/sentripet
          if xattr -p com.apple.quarantine /Applications/SentriPet.app 2>/dev/null; then
            echo "SentriPet.app is still quarantined"; exit 1
          fi
          code=0
          /Applications/SentriPet.app/Contents/MacOS/SentriPet --selftest "$GITHUB_WORKSPACE/brew-test.txt" || code=$?
          tail -n 1 brew-test.txt
          echo "### Homebrew: $(tail -n 1 brew-test.txt)" >> "$GITHUB_STEP_SUMMARY"
          [ $code -eq 0 ] || { cat brew-test.txt; exit 1; }
          brew uninstall --cask sentripet
          [ ! -e /Applications/SentriPet.app ]

  winget:
    name: winget (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate the manifests and install from them
        shell: pwsh
        run: |
          winget --version
          # the runner's winget (1.11) predates the 1.12 schema winget-pkgs asks for; nothing 1.12-only is used,
          # so test the install with the version header lowered to 1.10
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object { (Get-Content $_ -Raw) -replace '1\.12\.0', '1.10.0' | Set-Content $_ -NoNewline -Encoding utf8NoBOM }
          winget validate --manifest packaging/winget
          if ($LASTEXITCODE) { exit 1 }
          winget settings --enable LocalManifestFiles
          winget install --manifest packaging/winget --disable-interactivity
          if ($LASTEXITCODE) { exit 1 }
      - name: Self-test through the command alias
        shell: pwsh
        run: |
          $alias = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\sentripet.exe"
          $item = Get-Item $alias
          $item | Format-List FullName, LinkType, Target
          # downloaded-file mark on the installed program (Explorer and Start-Process then ask before running it)
          Get-Item ($item.Target | Select-Object -First 1) -Stream * | Format-Table Stream, Length -AutoSize
          # started like typing "sentripet" in a terminal (CreateProcess; Start-Process goes through the shell,
          # whose "open file" prompt nobody can answer here)
          $psi = New-Object System.Diagnostics.ProcessStartInfo $alias
          $psi.Arguments = "--selftest `"$env:GITHUB_WORKSPACE\winget-test.txt`""
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.WaitForExit()
          Get-Content winget-test.txt -Tail 1
          "### winget: $(Get-Content winget-test.txt -Tail 1)" >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { Get-Content winget-test.txt; exit 1 }
      - name: Uninstall
        shell: pwsh
        run: |
          # every uninstall looks at all sources, and the msstore one wants its terms accepted first: drop it on this throwaway runner
          winget source remove msstore
          winget list --name SentriPet --disable-interactivity
          winget uninstall --name SentriPet --disable-interactivity
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\WinGet\Links\sentripet.exe") { Write-Error "the command alias is still there"; exit 1 }
